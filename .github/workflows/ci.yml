name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff pyyaml

      - name: Lint notebooks
        run: python -m ruff check notebooks/

      - name: Validate job configs
        run: python tools/validate_jobs.py notebooks/prod_databricks_usage_analytics.yml notebooks/dev_databricks_usage_analytics.yml
