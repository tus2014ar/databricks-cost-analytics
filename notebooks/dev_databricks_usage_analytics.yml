resources:
  jobs:
    dev_databricks_usage_analytics:
      name: dev_databricks_usage_analytics
      description: Databricks Cost Analytics pipeline. Reads from Databricks system
        tables (billing, compute, lakeflow, access, serving), builds 8 silver
        tables and 4 gold tables + 2 views in
        dev_data_automation.databricks_analytics.
      tasks:
        - task_key: table_setup_check
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.initial_full_load}}"
            right: "True"
        - task_key: table_setup
          depends_on:
            - task_key: table_setup_check
              outcome: "true"
          notebook_task:
            notebook_path: domains/data_automation/databricks_analytics/notebooks/1.0_table_setup
            source: GIT
        - task_key: silver_databricks_usage
          depends_on:
            - task_key: table_setup_check
              outcome: "false"
            - task_key: table_setup
          run_if: NONE_FAILED
          notebook_task:
            notebook_path: domains/data_automation/databricks_analytics/notebooks/2.0_silver_databricks_usage
            source: GIT
            warehouse_id: <WAREHOUSE_ID>
        - task_key: gold_databricks_analytics
          depends_on:
            - task_key: silver_databricks_usage
          notebook_task:
            notebook_path: domains/data_automation/databricks_analytics/notebooks/3.0_gold_databricks_analytics
            source: GIT
            warehouse_id: <WAREHOUSE_ID>
      git_source:
        git_url: https://github.com/your-org/your-pipelines-repo
        git_provider: gitHub
        git_branch: dev
      tags:
        domain: data_automation
        source: databricks_system_tables
      queue:
        enabled: true
      parameters:
        - name: environment
          default: dev
        - name: initial_full_load
          default: "False"
        - name: prefix
          default: dev_
        - name: verbose
          default: "False"
      run_as:
        service_principal_name: <SERVICE_PRINCIPAL_ID>
      budget_policy_id: <BUDGET_POLICY_ID>
      performance_target: STANDARD